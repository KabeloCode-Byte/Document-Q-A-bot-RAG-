<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SA Document Q&amp;A</title>
<style>
  :root { --bg:#f4f1ec; --card:#fff; --ink:#1f2933; --muted:#6b7280; --accent:#2f6f5e; --line:#e3ded5; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#16191c; --card:#20252a; --ink:#e8ecef; --muted:#9aa5b1; --accent:#5fb89e; --line:#2f363d; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:system-ui,sans-serif; line-height:1.5; }
  main { max-width:760px; margin:0 auto; padding:24px 16px 64px; }
  h1 { font-size:1.4rem; margin:0 0 4px; }
  .sub { color:var(--muted); margin:0 0 20px; font-size:.95rem; }
  form { display:flex; gap:8px; }
  input { flex:1; padding:12px 14px; border:1px solid var(--line); border-radius:12px; background:var(--card); color:var(--ink); font-size:1rem; }
  button { padding:12px 18px; border:0; border-radius:12px; background:var(--accent); color:#fff; font-size:1rem; cursor:pointer; }
  button:disabled { opacity:.6; cursor:wait; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; margin-top:16px; }
  .answer { white-space:pre-wrap; }
  .src { margin-top:12px; padding-top:12px; border-top:1px solid var(--line); font-size:.9rem; }
  .src b { color:var(--accent); }
  .src small { color:var(--muted); display:block; }
  .err { color:#c0392b; }
</style>
</head>
<body>
<main>
  <h1>SA Document Q&amp;A</h1>
  <p class="sub">Ask a question about the indexed documents. Answers cite their sources.</p>
  <form id="f">
    <input id="q" placeholder="e.g. What are the lender's obligations under the Act?" required minlength="3" autofocus>
    <button id="b">Ask</button>
  </form>
  <div id="out"></div>
</main>
<script>
const f = document.getElementById('f'), q = document.getElementById('q'),
      b = document.getElementById('b'), out = document.getElementById('out');

function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

f.addEventListener('submit', async (e) => {
  e.preventDefault();
  b.disabled = true; b.textContent = 'Thinking…';
  out.innerHTML = '';
  try {
    const r = await fetch('/ask', { method:'POST', headers:{'Content-Type':'application/json'},
                                    body: JSON.stringify({ question: q.value }) });
    const data = await r.json();
    if (!r.ok) throw new Error(data.detail || 'Request failed');
    const srcs = data.sources.map(s =>
      `<div class="src"><b>[${s.id}]</b> ${esc(s.source)}, page ${s.page}<small>${esc(s.snippet)}…</small></div>`).join('');
    out.innerHTML = `<div class="card"><div class="answer">${esc(data.answer)}</div>${srcs}</div>`;
  } catch (err) {
    out.innerHTML = `<div class="card err">${esc(err.message)}</div>`;
  } finally {
    b.disabled = false; b.textContent = 'Ask';
  }
});
</script>
</body>
</html>
